<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banners de alerta con tono</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Banners de alerta con tono</h1>
        <p class="lede">El banner aparece una vez y suena una vez. Cerrarlo no repite el tono.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="actions">
      <button type="button" data-show="success">Éxito</button>
      <button type="button" data-show="warning">Aviso</button>
      <button type="button" data-show="error">Error</button>
      <button type="button" data-show="info">Info</button>
    </div>
    <section class="panel slot" aria-live="polite"></section>

  </main>
  <script src="script.js"></script>
</body>
</html>
