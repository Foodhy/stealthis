<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hover Image List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout">
      <header>
        <h1>Selected work</h1>
        <p>Hover a row — preview follows your pointer.</p>
      </header>

      <ul class="list" data-list>
        <li data-img="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80">
          <span class="title">Aurora UI</span>
          <span class="meta">Brand · 2025</span>
        </li>
        <li data-img="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=600&q=80">
          <span class="title">Kinetic Type</span>
          <span class="meta">Web · 2025</span>
        </li>
        <li data-img="https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=600&q=80">
          <span class="title">Chromatic</span>
          <span class="meta">Campaign · 2024</span>
        </li>
        <li data-img="https://images.unsplash.com/photo-1567095761054-7a02e69e5c43?w=600&q=80">
          <span class="title">Mono Archive</span>
          <span class="meta">Editorial · 2024</span>
        </li>
      </ul>
    </main>

    <div class="floater" data-floater hidden aria-hidden="true">
      <img src="" alt="" />
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
