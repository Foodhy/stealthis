<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor-reactive Mesh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo" data-demo="Cursor-reactive Mesh">
    <section class="mesh" aria-labelledby="mesh-title">
      <header class="mesh__head">
        <h1 id="mesh-title">Cursor-reactive mesh</h1>
        <p class="mesh__hint">
          Move the pointer across the field &mdash; or focus it and steer with the arrow keys.
          Points spring toward the cursor and inherit its velocity.
        </p>
      </header>

      <div class="mesh__stage">
        <canvas
          id="field"
          class="mesh__canvas"
          tabindex="0"
          role="img"
          aria-label="Animated grid of points that bend toward the pointer"
        ></canvas>
        <output id="readout" class="mesh__readout">v 0.00</output>
      </div>

      <div class="mesh__controls">
        <label class="ctl" for="radius">
          <span>Influence radius</span>
          <input id="radius" type="range" min="60" max="280" step="10" value="160" />
        </label>
        <label class="ctl" for="stiff">
          <span>Spring stiffness</span>
          <input id="stiff" type="range" min="2" max="24" step="1" value="10" />
        </label>
        <label class="ctl ctl--check" for="links">
          <input id="links" type="checkbox" checked />
          <span>Draw links</span>
        </label>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
