<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holographic Tilt Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <article class="holo-card" tabindex="0">
      <div class="holo-card__foil" aria-hidden="true"></div>

        <p class="holo-card__kicker">Rare · 001</p>

      </div>
    </article>
  </div>
  <script src="script.js"></script>
</body>
</html>
