<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product 360 Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo" data-demo="Product 360 Viewer">
    <header class="viewer__head">
      <div>
        <h1 class="viewer__title">Orbit Speaker</h1>
        <p class="viewer__sub">Drag to spin &middot; arrow keys to nudge &middot; wheel to zoom</p>
      </div>
      <button type="button" class="btn" id="reset-scene">Reset view</button>
    </header>

    <div class="canvas-wrap">
      <canvas
        id="glcanvas"
        tabindex="0"
        role="img"
        aria-label="Interactive 3D product viewer. Use the arrow keys to rotate."
      ></canvas>
      <p class="stage-fallback" id="fallback" hidden>WebGL is unavailable in this browser.</p>
    </div>

    <div class="controls">
      <label class="ctl">
        <span>Yaw</span>
        <input type="range" id="yaw" min="-180" max="180" step="1" value="24" />
        <output id="yaw-out">24&deg;</output>
      </label>
      <label class="ctl">
        <span>Pitch</span>
        <input type="range" id="pitch" min="-70" max="70" step="1" value="-14" />
        <output id="pitch-out">-14&deg;</output>
      </label>
      <label class="ctl ctl--toggle">
        <input type="checkbox" id="spin" checked />
        <span>Auto-spin</span>
      </label>
      <p class="hint" id="scene-readout" role="status">Drag to rotate</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
