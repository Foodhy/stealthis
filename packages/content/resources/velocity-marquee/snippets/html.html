<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velocity Marquee</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="copy">
      <h1>Scroll fast</h1>
      <p>The ticker below speeds up with your scroll velocity.</p>
    </section>

    <div class="marquee-wrap" aria-hidden="true">
      <div class="marquee" data-marquee>
        <span>Steal patterns · Ship faster · Scroll-driven motion · </span>
        <span>Steal patterns · Ship faster · Scroll-driven motion · </span>
      </div>
    </div>

    <section class="copy tall">
      <p>Keep scrolling to feel the band accelerate and ease back.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
