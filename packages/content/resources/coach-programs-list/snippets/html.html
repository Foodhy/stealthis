<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ironpath Coaching — Training Programs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero__brand">
        <span class="hero__mark" aria-hidden="true">◤</span>
        <span class="hero__name">Ironpath</span>
      </div>
      <p class="hero__kicker">Coach Mara Vance · Certified S&amp;C</p>
      <h1 class="hero__title">Pick Your <em>Program</em></h1>
      <p class="hero__sub">Structured, progressive training blocks built to get you moving, lifting, and feeling unstoppable. No fluff — just results.</p>
    </header>

    <section class="filters" aria-label="Filter programs">
      <div class="filters__group" role="group" aria-label="Filter by goal">
        <span class="filters__label">Goal</span>
        <div class="chips" id="goalChips">
          <button class="chip is-active" data-filter="goal" data-value="all" aria-pressed="true">All</button>
          <button class="chip" data-filter="goal" data-value="strength" aria-pressed="false">Strength</button>
          <button class="chip" data-filter="goal" data-value="hypertrophy" aria-pressed="false">Hypertrophy</button>
          <button class="chip" data-filter="goal" data-value="fat-loss" aria-pressed="false">Fat Loss</button>
          <button class="chip" data-filter="goal" data-value="endurance" aria-pressed="false">Endurance</button>
          <button class="chip" data-filter="goal" data-value="mobility" aria-pressed="false">Mobility</button>
        </div>
      </div>
      <div class="filters__group" role="group" aria-label="Filter by level">
        <span class="filters__label">Level</span>
        <div class="chips" id="levelChips">
          <button class="chip is-active" data-filter="level" data-value="all" aria-pressed="true">All</button>
          <button class="chip" data-filter="level" data-value="beginner" aria-pressed="false">Beginner</button>
          <button class="chip" data-filter="level" data-value="intermediate" aria-pressed="false">Intermediate</button>
          <button class="chip" data-filter="level" data-value="advanced" aria-pressed="false">Advanced</button>
        </div>
      </div>
      <div class="filters__meta">
        <span class="filters__count" id="resultCount" aria-live="polite">6 programs</span>
        <button class="filters__reset" id="resetBtn" type="button" hidden>Reset</button>
      </div>
    </section>

    <main class="grid" id="programGrid" aria-label="Available programs">
      <!-- Cards injected by script.js -->
    </main>

    <div class="empty" id="emptyState" hidden>
      <p class="empty__title">No programs match that combo</p>
      <p class="empty__sub">Try widening your goal or level filters.</p>
      <button class="btn btn--ghost" type="button" data-reset>Clear filters</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
