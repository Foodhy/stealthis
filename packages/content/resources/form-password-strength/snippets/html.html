<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo" data-demo="Password Strength">
    <form class="pw" novalidate>
      <h1 class="pw__title">Create a password</h1>
      <p class="pw__lede">Scored locally with entropy math — nothing leaves this page.</p>

      <div class="pw__field">
        <label for="password">Password</label>
        <div class="pw__control">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            spellcheck="false"
            aria-describedby="strength-label entropy-out rules"
          />
          <button type="button" class="pw__reveal" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="pw__meter">
        <div class="pw__bar" data-level="0" role="img" aria-label="Strength meter">
          <span class="pw__seg"></span><span class="pw__seg"></span><span class="pw__seg"></span><span class="pw__seg"></span>
        </div>
        <div class="pw__readout">
          <span id="strength-label" class="pw__label" role="status" aria-live="polite">Enter a password</span>
          <span id="entropy-out" class="pw__entropy">0 bits</span>
        </div>
      </div>

      <ul class="pw__rules" id="rules">
        <li data-rule="length"><span class="pw__dot" aria-hidden="true"></span>At least 12 characters</li>
        <li data-rule="case"><span class="pw__dot" aria-hidden="true"></span>Upper and lower case</li>
        <li data-rule="digit"><span class="pw__dot" aria-hidden="true"></span>A number</li>
        <li data-rule="symbol"><span class="pw__dot" aria-hidden="true"></span>A symbol</li>
        <li data-rule="varied"><span class="pw__dot" aria-hidden="true"></span>No repeats, keyboard runs or common words</li>
      </ul>

      <p class="pw__crack">Offline guess time: <strong id="crack-time">—</strong></p>

      <button type="submit" class="pw__submit" disabled>Create account</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
