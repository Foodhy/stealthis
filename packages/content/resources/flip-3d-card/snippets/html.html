<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flip Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <button class="flip" type="button" aria-label="Flip card">
      <span class="flip__inner">
        <span class="flip__face flip__face--front">
          <span class="flip__kicker">Hover or focus</span>
          <strong>Nova Deck</strong>
        </span>
        <span class="flip__face flip__face--back">
          <span class="flip__kicker">Back</span>
          <strong>12 prints · foil stock</strong>
        </span>
      </span>
    </button>
  </div>
</body>
</html>
