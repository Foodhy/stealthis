<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interior — Before / After Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">Studio Marrow · Portfolio</p>
      <h1>Before &amp; After</h1>
      <p class="lede">
        Drag the brass divider to reveal how each empty shell becomes a finished room.
        Every study keeps its own reveal point — pick a room, slide the seam, or let it play.
      </p>
    </header>

    <nav class="rooms" aria-label="Choose a room study">
      <button class="room is-active" type="button" data-room="living" aria-pressed="true">
        <span class="room__name">Living Room</span>
        <span class="room__meta">Ashgrove Loft</span>
      </button>
      <button class="room" type="button" data-room="kitchen" aria-pressed="false">
        <span class="room__name">Kitchen</span>
        <span class="room__meta">Fenwick Terrace</span>
      </button>
      <button class="room" type="button" data-room="bedroom" aria-pressed="false">
        <span class="room__name">Bedroom</span>
        <span class="room__meta">Juniper House</span>
      </button>
    </nav>

    <figure class="stage">
      <div
        class="compare"
        id="compare"
        role="slider"
        tabindex="0"
        aria-label="Reveal amount of the designed room"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="50"
        aria-valuetext="50% designed"
      >
        <div class="layer layer--after" id="afterLayer" aria-hidden="true"></div>
        <div class="layer layer--before" id="beforeLayer">
          <div class="layer__inner" id="beforeInner" aria-hidden="true"></div>
        </div>

        <span class="tag tag--before">Empty shell</span>
        <span class="tag tag--after">Designed</span>

        <div class="divider" id="divider">
          <button class="handle" id="handle" type="button" aria-hidden="true" tabindex="-1">
            <span class="handle__arrow">‹</span>
            <span class="handle__grip"></span>
            <span class="handle__arrow">›</span>
          </button>
        </div>

        <output class="readout" id="readout">50%</output>
      </div>

      <figcaption class="caption">
        <span class="caption__dot" aria-hidden="true"></span>
        <span id="caption">Warm oak, boucle seating and a layered rug turn the bare loft into a reading room.</span>
      </figcaption>
    </figure>

    <div class="controls">
      <div class="presets" role="group" aria-label="Reveal presets">
        <button class="chip" type="button" data-pos="0">Empty</button>
        <button class="chip" type="button" data-pos="33">Reveal ⅓</button>
        <button class="chip" type="button" data-pos="50">Split</button>
        <button class="chip" type="button" data-pos="67">Reveal ⅔</button>
        <button class="chip" type="button" data-pos="100">Designed</button>
      </div>
      <button class="play" id="play" type="button" aria-pressed="false">
        <span class="play__icon" id="playIcon">▶</span>
        <span id="playLabel">Play reveal</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
