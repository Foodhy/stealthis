<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tonos de aviso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Tonos de aviso</h1>
        <p class="lede">Ocho avisos distintos, sintetizados al momento. Pulsa una tarjeta para oír el tono que le corresponde.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="grid">
      <button class="tone" type="button" data-sound="success" style="--c:#128a52"><i class="swatch"></i><strong>Éxito</strong><span>Acuerdo mayor, corto y claro.</span></button>
      <button class="tone" type="button" data-sound="error" style="--c:#d1264a"><i class="swatch"></i><strong>Error</strong><span>Caída grave con un poco de ruido.</span></button>
      <button class="tone" type="button" data-sound="warning" style="--c:#d08912"><i class="swatch"></i><strong>Aviso</strong><span>Dos notas que piden atención.</span></button>
      <button class="tone" type="button" data-sound="info" style="--c:#0b74c9"><i class="swatch"></i><strong>Info</strong><span>Campana suave, sin alarma.</span></button>
      <button class="tone" type="button" data-sound="message" style="--c:#2f5bff"><i class="swatch"></i><strong>Mensaje</strong><span>Pop brillante de bandeja.</span></button>
      <button class="tone" type="button" data-sound="mention" style="--c:#6d4dff"><i class="swatch"></i><strong>Mención</strong><span>Doble ding para cuando te nombran.</span></button>
      <button class="tone" type="button" data-sound="urgent" style="--c:#e23b3b"><i class="swatch"></i><strong>Urgente</strong><span>Tres pulsos seguidos.</span></button>
      <button class="tone" type="button" data-sound="copy" style="--c:#0e8f8a"><i class="swatch"></i><strong>Copiado</strong><span>Clic agudo de confirmación.</span></button>
    </div>

  </main>
  <script src="script.js"></script>
</body>
</html>
