<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deshacer con tono inverso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Deshacer con tono inverso</h1>
        <p class="lede">Archiva, mueve o elimina. Tienes unos segundos para deshacer, y ese gesto suena al revés.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="actions">
      <button type="button" class="primary" data-do="archivar">Archivar</button>
      <button type="button" class="ghost" data-do="mover">Mover</button>
      <button type="button" class="danger" data-do="eliminar">Eliminar</button>
    </div>
    <section class="panel bar" data-undo hidden>
      <div><b data-name>Acción</b><span>Puedes deshacerla antes de que se asiente.</span></div>
      <button type="button" class="ghost" data-revert>Deshacer</button>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
