<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tirar para actualizar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Tirar para actualizar</h1>
        <p class="lede">Baja la lista desde arriba. Al pasar el umbral entra una fila nueva con un pop.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel">
      <p class="hint" data-hint>Tira hacia abajo</p>
      <div class="feed" data-feed>
        <article class="row"><b>Notas de ayer</b><span>El resumen ya está en la bandeja.</span></article>
        <article class="row"><b>Mapa</b><span>Dos eventos cerca de ti.</span></article>
        <article class="row"><b>Equipo</b><span>Nora dejó un comentario.</span></article>
      </div>
      <div class="actions" style="padding:12px"><button type="button" class="ghost" data-refresh>Actualizar</button></div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
