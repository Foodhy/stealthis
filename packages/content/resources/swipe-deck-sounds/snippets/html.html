<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mazo con sonido al deslizar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Mazo con sonido al deslizar</h1>
        <p class="lede">Arrastra la tarjeta. Mientras se mueve hay un soplo, y al soltarla suena guardar u omitir.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <p class="hints"><span>← Omitir</span><span>Guardar →</span></p>
    <section class="panel deck" aria-label="Mazo"></section>
    <div class="hints">
      <button type="button" class="reset" data-choice="left">Omitir</button>
      <button type="button" class="reset" data-reset>Reiniciar mazo</button>
      <button type="button" class="reset" data-choice="right">Guardar</button>
    </div>

  </main>
  <script src="script.js"></script>
</body>
</html>
