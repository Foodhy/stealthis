<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta atrás con alarma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Cuenta atrás con alarma</h1>
        <p class="lede">Cinco segundos, un tic por cada uno, y una alarma breve al llegar a cero.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel clock">
      <p class="num" data-num>5</p>
      <div class="actions" style="justify-content:center">
        <button type="button" class="primary" data-start>Empezar</button>
        <button type="button" class="ghost" data-stop>Pausa</button>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
