<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teclas con clic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Teclas con clic</h1>
        <p class="lede">Cada tecla hace un clic corto. Retroceso es más grave. Enter envía la línea con una campanilla.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel thread" aria-live="polite"></section>
    <form class="composer">
      <textarea aria-label="Mensaje" placeholder="Escribe y pulsa Enter para enviar"></textarea>
      <button class="send" type="submit">Enviar</button>
    </form>

  </main>
  <script src="script.js"></script>
</body>
</html>
