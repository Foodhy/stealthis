<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Dissolve Shader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <p class="eyebrow">WebGL · GLSL fragment shader</p>
      <h1>Image Dissolve Shader</h1>
      <p class="lede">
        Hover the card to dissolve one texture into another. A fractal-noise map drives
        <code>u_progress</code>, and an RGB-shift tears the moving edge apart.
      </p>
    </header>

    <section class="stage" aria-label="Dissolve shader preview">
      <figure class="card" id="card" tabindex="0" aria-describedby="card-hint">
        <canvas id="gl" class="gl" aria-label="Two images dissolving into each other"></canvas>
        <div class="css-fallback" id="fallback" aria-hidden="true">
          <div class="css-img css-a"></div>
          <div class="css-img css-b"></div>
        </div>
        <figcaption class="badge">
          <span class="dot" aria-hidden="true"></span>
          <span id="captionText">Hover / focus to reveal</span>
        </figcaption>
      </figure>
      <p id="card-hint" class="hint">
        Tip: focus the card and press <kbd>Space</kbd> to toggle the reveal.
      </p>
    </section>

    <section class="panel" aria-label="Shader controls">
      <div class="panel-row">
        <label class="ctl" for="progress">
          <span class="ctl-label">Progress <b id="progressVal">0.00</b></span>
          <input id="progress" type="range" min="0" max="1" step="0.001" value="0" />
        </label>
        <label class="ctl" for="edge">
          <span class="ctl-label">Edge softness <b id="edgeVal">0.10</b></span>
          <input id="edge" type="range" min="0.02" max="0.35" step="0.01" value="0.10" />
        </label>
      </div>
      <div class="panel-row">
        <label class="ctl" for="shift">
          <span class="ctl-label">RGB shift <b id="shiftVal">0.06</b></span>
          <input id="shift" type="range" min="0" max="0.16" step="0.005" value="0.06" />
        </label>
        <label class="ctl" for="scale">
          <span class="ctl-label">Noise scale <b id="scaleVal">3.2</b></span>
          <input id="scale" type="range" min="1" max="8" step="0.1" value="3.2" />
        </label>
      </div>

      <div class="panel-row wrap-row">
        <fieldset class="pairs">
          <legend>Texture pair</legend>
          <div class="pair-btns" id="pairs" role="radiogroup" aria-label="Texture pair">
            <button class="pair" data-pair="0" role="radio" aria-checked="true">Coast → Dune</button>
            <button class="pair" data-pair="1" role="radio" aria-checked="false">Forest → Peak</button>
            <button class="pair" data-pair="2" role="radio" aria-checked="false">Neon → Ember</button>
          </div>
        </fieldset>

        <div class="toggles">
          <button id="noiseToggle" class="toggle" aria-pressed="false">Show noise map</button>
          <button id="autoToggle" class="toggle" aria-pressed="false">Auto loop</button>
        </div>
      </div>

      <p class="status" id="status" role="status">Initializing WebGL…</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
