<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de conexión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Estado de conexión</h1>
        <p class="lede">En línea, sincronizando, sin conexión y de vuelta. El timbre dice qué tan grave es.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="actions">
      <button type="button" class="ghost" data-net="online">En línea</button>
      <button type="button" class="ghost" data-net="sync">Sincronizando</button>
      <button type="button" class="ghost" data-net="offline">Sin conexión</button>
      <button type="button" class="ghost" data-net="back">De vuelta</button>
    </div>
    <p class="panel pill"><span data-label>En línea</span><i class="dot" data-dot></i></p>

  </main>
  <script src="script.js"></script>
</body>
</html>
