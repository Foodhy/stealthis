<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaming Markdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-label="Streaming markdown renderer">
    <header class="app__head">
      <div class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <div>
          <h1 class="brand__title">Streaming Markdown</h1>
          <p class="brand__sub">Token-by-token rendering with a live parser</p>
        </div>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span class="status__pill" data-state="idle" id="statusPill">
          <span class="status__glow" aria-hidden="true"></span>
          <span id="statusText">Idle</span>
        </span>
      </div>
    </header>

    <section class="stream" aria-label="Rendered markdown output">
      <div class="stream__bar">
        <div class="stream__meta">
          <span class="avatar" aria-hidden="true">AI</span>
          <span class="stream__label">assistant</span>
        </div>
        <div class="stream__stats">
          <span class="stat"><span id="tokenCount">0</span> tokens</span>
          <span class="stat stat--pct"><span id="pct">0</span>%</span>
        </div>
      </div>
      <article class="md" id="output" aria-live="polite" aria-busy="false">
        <div class="md__empty" id="emptyState">
          <p>Press <strong>Start</strong> to stream a markdown response.</p>
        </div>
      </article>
    </section>

    <footer class="controls" aria-label="Playback controls">
      <div class="controls__group">
        <button class="btn btn--primary" id="startBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M8 5v14l11-7z"/></svg>
          <span id="startLabel">Start</span>
        </button>
        <button class="btn" id="stopBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M6 6h12v12H6z"/></svg>
          <span>Stop</span>
        </button>
        <button class="btn" id="replayBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          <span>Replay</span>
        </button>
      </div>

      <div class="controls__group controls__group--speed" role="group" aria-label="Stream speed">
        <span class="speed__label">Speed</span>
        <div class="seg" id="speed">
          <button class="seg__btn" type="button" data-speed="0.5">Slow</button>
          <button class="seg__btn is-active" type="button" data-speed="1" aria-pressed="true">Normal</button>
          <button class="seg__btn" type="button" data-speed="2.4">Turbo</button>
        </div>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
