<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photography — Fullscreen Slideshow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" id="stage" aria-roledescription="carousel" aria-label="Fullscreen photography slideshow">
    <!-- Slides injected/enhanced by JS, but authored here for no-JS fallback -->
    <div class="slides" id="slides">
      <figure class="slide is-active" role="group" aria-roledescription="slide" aria-label="1 of 5">
        <div class="slide-img" style="background-image:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=2400&q=80')"></div>
      </figure>
      <figure class="slide" role="group" aria-roledescription="slide" aria-label="2 of 5">
        <div class="slide-img" style="background-image:url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2400&q=80')"></div>
      </figure>
      <figure class="slide" role="group" aria-roledescription="slide" aria-label="3 of 5">
        <div class="slide-img" style="background-image:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=80')"></div>
      </figure>
      <figure class="slide" role="group" aria-roledescription="slide" aria-label="4 of 5">
        <div class="slide-img" style="background-image:url('https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=2400&q=80')"></div>
      </figure>
      <figure class="slide" role="group" aria-roledescription="slide" aria-label="5 of 5">
        <div class="slide-img" style="background-image:url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=80')"></div>
      </figure>
    </div>

    <div class="scrim" aria-hidden="true"></div>

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">ALDEN &amp; VOSS</span>
      </div>
      <div class="counter" aria-live="off">
        <span id="counter-cur">01</span><span class="counter-sep">/</span><span id="counter-total">05</span>
      </div>
    </header>

    <!-- Caption -->
    <div class="caption" id="caption">
      <p class="eyebrow" id="cap-eyebrow">Wilderness Series</p>
      <h1 class="cap-title" id="cap-title">Vellum Ridge at First Light</h1>
      <p class="cap-meta" id="cap-meta">
        <span id="cap-loc">Dolomites, Italy</span>
        <span class="dot" aria-hidden="true"></span>
        <span id="cap-shot">1/250s · f/8 · ISO 100</span>
      </p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="nav" id="prev" type="button" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="play" id="play" type="button" aria-label="Pause slideshow" aria-pressed="true">
        <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-bg" cx="22" cy="22" r="20"></circle>
          <circle class="ring-fg" id="ring" cx="22" cy="22" r="20"></circle>
        </svg>
        <span class="play-glyph" id="play-glyph" aria-hidden="true"></span>
      </button>

      <button class="nav" id="next" type="button" aria-label="Next photo">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Progress dots -->
    <nav class="dots" id="dots" aria-label="Choose photo"></nav>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
