<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logro desbloqueado</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Logro desbloqueado</h1>
        <p class="lede">Desbloquea un logro. Cada uno tiene su propio acorde, corto y distinto.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="grid">
      <button type="button" class="panel card" data-award="racha"><i class="mark">7</i><strong>Racha</strong><span>Siete días seguidos.</span></button>
      <button type="button" class="panel card" data-award="aviso"><i class="mark">1</i><strong>Primer aviso</strong><span>Tu bandeja ya habla.</span></button>
      <button type="button" class="panel card" data-award="mapa"><i class="mark">★</i><strong>Explorador</strong><span>Recorriste el mapa.</span></button>
    </div>

  </main>
  <script src="script.js"></script>
</body>
</html>
