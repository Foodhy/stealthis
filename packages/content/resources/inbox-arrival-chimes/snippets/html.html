<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campanas de bandeja</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Campanas de bandeja</h1>
        <p class="lede">Mensaje, correo y sistema no comparten timbre. Recíbelos uno a uno o deja la bandeja en vivo.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="bar">
      <button type="button" data-kind="message">Mensaje</button>
      <button type="button" data-kind="email">Correo</button>
      <button type="button" data-kind="system">Sistema</button>
      <button type="button" class="live" data-live aria-pressed="false">En vivo</button>
      <span class="badge" data-count>0</span>
    </div>
    <section class="panel list" aria-live="polite">
      <p class="empty">La bandeja está en calma. Recibe un aviso para oír su campana.</p>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
