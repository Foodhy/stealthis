<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Safety Checklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="checklist" aria-labelledby="cl-title">
      <header class="cl-head">
        <div class="cl-head__bar" aria-hidden="true"></div>
        <div class="cl-head__row">
          <div>
            <p class="cl-eyebrow">Daily Walkdown</p>
            <h1 id="cl-title">Site Safety Checklist</h1>
          </div>
          <span class="cl-site">Riverside Tower &middot; Block C</span>
        </div>

        <div class="cl-meter" role="group" aria-label="Checklist completion">
          <div class="cl-meter__top">
            <span class="cl-meter__label">Completion</span>
            <span class="cl-meter__pct" id="cl-pct">0%</span>
          </div>
          <div class="cl-meter__track">
            <div class="cl-meter__fill" id="cl-fill" style="width: 0%"></div>
          </div>
          <p class="cl-meter__count" id="cl-count">0 of 0 items reviewed</p>
        </div>
      </header>

      <form id="cl-form" novalidate>
        <div class="cl-groups">
          <fieldset class="cl-group" data-group="PPE">
            <legend>Personal Protective Equipment</legend>
            <label class="cl-item">
              <input type="checkbox" name="ppe-hardhat" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Hard hats worn by all on-site personnel</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="ppe-hivis" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Hi-vis vests in good condition</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="ppe-boots" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Steel-toe boots and gloves available</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="ppe-eyes" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Eye and hearing protection at cutting stations</span>
            </label>
          </fieldset>

          <fieldset class="cl-group" data-group="Equipment">
            <legend>Equipment</legend>
            <label class="cl-item">
              <input type="checkbox" name="eq-scaffold" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Scaffolding tagged and inspected today</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="eq-ladders" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Ladders secured, no damaged rungs</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="eq-power" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Power tools guarded, leads off walkways</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="eq-crane" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Crane exclusion zone barricaded</span>
            </label>
          </fieldset>

          <fieldset class="cl-group" data-group="Hazards">
            <legend>Hazards</legend>
            <label class="cl-item">
              <input type="checkbox" name="hz-edges" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Open edges and floor voids guarded</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="hz-spill" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">No fuel or chemical spills present</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="hz-dust" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Dust suppression running near demolition</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="hz-fire" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Extinguishers charged, hot-work permit valid</span>
            </label>
          </fieldset>

          <fieldset class="cl-group" data-group="Signage">
            <legend>Signage</legend>
            <label class="cl-item">
              <input type="checkbox" name="sg-warning" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Warning signs posted at access points</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="sg-muster" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Muster point and exits clearly marked</span>
            </label>
            <label class="cl-item">
              <input type="checkbox" name="sg-speed" />
              <span class="cl-box" aria-hidden="true"></span>
              <span class="cl-text">Site speed limit and one-way signs visible</span>
            </label>
          </fieldset>
        </div>

        <section class="cl-flags" aria-labelledby="cl-flags-title">
          <div class="cl-flags__head">
            <h2 id="cl-flags-title">Flagged issues</h2>
            <span class="cl-tag" id="cl-flag-tag">None logged</span>
          </div>
          <label class="cl-vh" for="cl-notes">Describe any flagged issues</label>
          <textarea
            id="cl-notes"
            name="notes"
            rows="3"
            placeholder="e.g. North scaffold tag expired &mdash; isolated, reported to Dana M. at 07:40"
          ></textarea>
        </section>

        <section class="cl-signoff" aria-labelledby="cl-signoff-title">
          <h2 id="cl-signoff-title">Supervisor sign-off</h2>
          <p class="cl-signoff__hint" id="cl-signoff-hint">
            Review every item to enable sign-off.
          </p>
          <div class="cl-signoff__row">
            <label class="cl-vh" for="cl-name">Supervisor name</label>
            <input
              id="cl-name"
              name="supervisor"
              type="text"
              autocomplete="name"
              placeholder="Supervisor name"
            />
            <button type="submit" id="cl-submit" disabled>Sign off</button>
          </div>
          <p class="cl-stamp" id="cl-stamp" hidden></p>
        </section>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
