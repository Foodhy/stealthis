<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controles con microsonido</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Controles con microsonido</h1>
        <p class="lede">Botones, interruptor, pestañas, casilla y un deslizador que cambia de tono mientras lo mueves.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel board">
      <div class="rowline">
        <button type="button" class="primary" data-press="primary">Guardar</button>
        <button type="button" class="ghost" data-press="ghost">Cancelar</button>
        <button type="button" class="danger" data-press="danger">Eliminar</button>
      </div>
      <div class="rowline">
        <button type="button" class="switch" role="switch" aria-checked="false" aria-label="Notificaciones" data-switch><i></i></button>
        <span>Notificaciones</span>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" class="is-on" data-tab>Día</button>
        <button type="button" data-tab>Semana</button>
        <button type="button" data-tab>Mes</button>
      </div>
      <label class="check"><input type="checkbox" data-check /> Recordarme en este equipo</label>
      <label>Volumen del aviso <input type="range" min="0" max="100" value="40" data-range /></label>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
