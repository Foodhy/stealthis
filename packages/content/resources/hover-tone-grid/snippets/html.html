<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rejilla que suena al tocar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Rejilla que suena al tocar</h1>
        <p class="lede">Pasa el cursor o el dedo por las piezas. Cada casilla es una nota distinta, como un teclado escondido al final de la página.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel field" aria-label="Rejilla de notas"></section>

  </main>
  <script src="script.js"></script>
</body>
</html>
