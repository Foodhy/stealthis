<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soltar archivos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Soltar archivos</h1>
        <p class="lede">Pasa un archivo por la zona o suelta una muestra. Entrar suena distinto de caer.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="actions">
      <button type="button" class="primary" data-sample="notas.txt">Soltar notas.txt</button>
      <button type="button" class="ghost" data-sample="foto.png">Soltar foto.png</button>
    </div>
    <div class="zone" data-zone>Arrastra un archivo aquí</div>
    <div class="files" data-files></div>

  </main>
  <script src="script.js"></script>
</body>
</html>
