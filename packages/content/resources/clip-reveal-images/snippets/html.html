<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip Reveal Images</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Clip reveals</h1>
      <p>Scroll to unmask each frame.</p>
    </header>

    <main class="grid">
      <figure class="reveal" data-reveal>
        <div class="frame"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&q=80" alt="" /></div>
        <figcaption>Horizon</figcaption>
      </figure>
      <figure class="reveal reveal--right" data-reveal>
        <div class="frame"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" alt="" /></div>
        <figcaption>Canopy</figcaption>
      </figure>
      <figure class="reveal" data-reveal>
        <div class="frame"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80" alt="" /></div>
        <figcaption>Fog line</figcaption>
      </figure>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
