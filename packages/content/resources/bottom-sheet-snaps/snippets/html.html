<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoja inferior con encajes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Hoja inferior con encajes</h1>
        <p class="lede">Arrastra el asa o elige un encaje. Cada altura tiene su nota.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel phone">
      <div class="sheet" data-sheet>
        <div class="handle" data-handle aria-hidden="true"></div>
        <div class="snaps">
          <button type="button" class="ghost" data-snap="cerrada">Cerrada</button>
          <button type="button" class="ghost" data-snap="media">Media</button>
          <button type="button" class="primary" data-snap="arriba">Arriba</button>
        </div>
        <p class="lede" style="margin-top:14px">La hoja encaja en tres alturas. El soplo suena al arrastrar y la nota al soltar en un punto.</p>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
