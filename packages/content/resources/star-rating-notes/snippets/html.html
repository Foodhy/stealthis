<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estrellas en escala</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Estrellas en escala</h1>
        <p class="lede">Elige de una a cinco estrellas. La escala sube con la nota.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel stars" aria-label="Valoración">
      <button type="button" class="star" data-star="1" aria-label="1 estrella">1</button>
      <button type="button" class="star" data-star="2" aria-label="2 estrellas">2</button>
      <button type="button" class="star" data-star="3" aria-label="3 estrellas">3</button>
      <button type="button" class="star" data-star="4" aria-label="4 estrellas">4</button>
      <button type="button" class="star" data-star="5" aria-label="5 estrellas">5</button>
      <button type="button" class="ghost" data-clear>Quitar</button>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
