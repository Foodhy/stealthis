<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código con clics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Código con clics</h1>
        <p class="lede">Seis casillas. Cada dígito hace clic y el código completo cierra con un acorde.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel otp" data-otp>
      <input aria-label="Dígito 1" inputmode="numeric" maxlength="1" data-digit />
      <input aria-label="Dígito 2" inputmode="numeric" maxlength="1" data-digit />
      <input aria-label="Dígito 3" inputmode="numeric" maxlength="1" data-digit />
      <input aria-label="Dígito 4" inputmode="numeric" maxlength="1" data-digit />
      <input aria-label="Dígito 5" inputmode="numeric" maxlength="1" data-digit />
      <input aria-label="Dígito 6" inputmode="numeric" maxlength="1" data-digit />
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
