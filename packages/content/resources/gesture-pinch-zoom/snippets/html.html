<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinch-zoom Image</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo" data-demo="Pinch-zoom Image">
    <header class="demo__head">
      <h1>Pinch-zoom Image</h1>
      <p class="muted">
        Pinch with two pointers to zoom around the midpoint, drag to pan, wheel to zoom at
        the cursor. Keyboard: arrows pan, <kbd>+</kbd>/<kbd>-</kbd> zoom, <kbd>0</kbd> resets.
      </p>
    </header>

    <div
      class="viewport"
      id="viewport"
      role="application"
      tabindex="0"
      aria-label="Zoomable image. Arrow keys pan, plus and minus zoom, zero resets."
    >
      <div class="canvas" id="canvas">
        <svg class="art" viewBox="0 0 400 300" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1b2a4a" />
              <stop offset="100%" stop-color="#4b2f63" />
            </linearGradient>
            <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2f8f7f" />
              <stop offset="100%" stop-color="#123b3a" />
            </linearGradient>
          </defs>
          <rect width="400" height="300" fill="url(#sky)" />
          <circle cx="310" cy="70" r="34" fill="#ffd9a0" opacity="0.9" />
          <g fill="#ffffff" opacity="0.7">
            <circle cx="40" cy="40" r="1.6" /><circle cx="95" cy="24" r="1.2" />
            <circle cx="150" cy="58" r="1.8" /><circle cx="220" cy="30" r="1.1" />
            <circle cx="265" cy="120" r="1.4" /><circle cx="60" cy="110" r="1.3" />
          </g>
          <path d="M0 210 L90 130 L150 195 L215 120 L300 210 L400 150 L400 300 L0 300 Z" fill="url(#ridge)" />
          <path d="M0 245 L70 205 L140 250 L230 200 L320 255 L400 220 L400 300 L0 300 Z" fill="#0d2430" />
          <text x="200" y="292" text-anchor="middle" font-size="9" fill="#9fd8ff" font-family="monospace">
            ZOOM IN FOR DETAIL — 400 × 300
          </text>
        </svg>
      </div>
      <p class="hint" id="hint">drag &amp; pinch</p>
    </div>

    <div class="bar">
      <label class="zoom">
        <span>Zoom</span>
        <input id="zoomRange" type="range" min="1" max="6" step="0.01" value="1" aria-label="Zoom level" />
        <output id="zoomOut" for="zoomRange">1.00×</output>
      </label>
      <button id="reset" type="button" class="btn">Reset</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">scale 1.00× · offset 0, 0</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
