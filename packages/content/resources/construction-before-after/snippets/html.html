<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Before / After Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="head__title">
        <span class="tag">Brixton &amp; Sons · Trades</span>
        <h1>Project Showcase</h1>
        <p>Drag the handle or use arrow keys to wipe between before and after.</p>
      </div>
      <button id="labelToggle" class="toggle" type="button" aria-pressed="true">
        <span class="toggle__dot" aria-hidden="true"></span>
        <span class="toggle__txt">Labels on</span>
      </button>
    </header>

    <!-- Comparison viewer -->
    <section
      class="ba"
      id="ba"
      aria-label="Before and after image comparison"
      data-pos="50"
    >
      <!-- AFTER is the base layer (full image) -->
      <div class="ba__layer ba__after" id="afterLayer" aria-hidden="true">
        <span class="ba__caption ba__caption--after">After</span>
      </div>
      <!-- BEFORE is clipped to the left of the handle -->
      <div class="ba__layer ba__before" id="beforeLayer" aria-hidden="true">
        <span class="ba__caption ba__caption--before">Before</span>
      </div>

      <div class="ba__divider" id="divider" aria-hidden="true"></div>

      <button
        class="ba__handle"
        id="handle"
        type="button"
        role="slider"
        aria-label="Reveal amount"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="50"
        aria-valuetext="50% revealed"
        tabindex="0"
      >
        <span class="ba__arrows" aria-hidden="true">‹ ›</span>
      </button>

      <div class="ba__readout" id="readout" aria-live="polite">50%</div>
    </section>

    <!-- Active project meta -->
    <div class="meta">
      <div>
        <h2 id="projTitle">Kitchen Remodel</h2>
        <p id="projDesc">Cabinet refit, quartz worktops &amp; new splashback — 9 days.</p>
      </div>
      <span class="badge" id="projBadge">Completed</span>
    </div>

    <!-- Gallery of pairs -->
    <section class="gallery" aria-label="Other projects">
      <h2 class="gallery__h">More projects</h2>
      <div class="gallery__grid" id="gallery"><!-- buttons injected by JS --></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
