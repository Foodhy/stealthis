<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulsación que carga</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Pulsación que carga</h1>
        <p class="lede">Mantén pulsado hasta que la barra llegue al final. Si sueltas antes, se cancela.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel hold">
      <button type="button" data-hold>Mantén para enviar</button>
      <div class="meter" aria-hidden="true"><i data-meter></i></div>
      <p class="lede">Unos instantes de carga. El tono sube contigo y solo confirma al completar.</p>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
