<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toasts con sonido</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Toasts con sonido</h1>
        <p class="lede">Cada aviso entra con su propio timbre y se va solo. Apila varios para oír cómo se distinguen.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <div class="actions">
      <button type="button" class="ok" data-toast="success">Éxito</button>
      <button type="button" class="bad" data-toast="error">Error</button>
      <button type="button" class="warn" data-toast="warning">Aviso</button>
      <button type="button" class="info" data-toast="info">Info</button>
    </div>
    <section class="panel stack">
      <div class="toasts" aria-live="polite"></div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
