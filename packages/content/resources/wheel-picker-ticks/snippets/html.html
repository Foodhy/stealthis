<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rueda que hace tic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Rueda que hace tic</h1>
        <p class="lede">Sube o baja la rueda. Cada opción que pasa por el centro hace tic.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <section class="panel wheel">
      <div class="row">
        <button type="button" class="ghost" data-step="-1" aria-label="Anterior">↑</button>
        <button type="button" class="ghost" data-step="1" aria-label="Siguiente">↓</button>
      </div>
      <p class="value" data-value>Hoy</p>
      <button type="button" class="primary" data-ok>Elegir</button>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
