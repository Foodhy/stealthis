<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinned Horizontal Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="intro">
      <h1>Scroll vertically</h1>
      <p>The gallery moves sideways while this block stays pinned.</p>
    </section>

    <section class="pin-wrap">
      <div class="pin-viewport">
        <div class="track">
          <article class="slide"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900&q=80" alt="" /><span>Mist</span></article>
          <article class="slide"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900&q=80" alt="" /><span>Alpine</span></article>
          <article class="slide"><img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=900&q=80" alt="" /><span>Coast</span></article>
          <article class="slide"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900&q=80" alt="" /><span>Peaks</span></article>
          <article class="slide"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&q=80" alt="" /><span>Surf</span></article>
        </div>
      </div>
    </section>

    <section class="outro">
      <p>End of gallery — keep scrolling.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
