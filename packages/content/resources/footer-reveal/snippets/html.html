<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Footer Reveal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page" data-page>
      <main>
        <section class="block">
          <h1>Content sheet</h1>
          <p>Scroll past the end — the footer was waiting underneath.</p>
        </section>
        <section class="block">
          <h2>More copy</h2>
          <p>Lenis keeps the reveal smooth; the sheet lifts slightly as you approach the edge.</p>
        </section>
        <section class="block">
          <h2>Almost there</h2>
          <p>One more push.</p>
        </section>
      </main>
    </div>

    <footer class="site-footer" data-footer>
      <p class="brand">StealThis</p>
      <p class="tag">Footer reveal pattern</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
