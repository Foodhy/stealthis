<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paleta de comandos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <div>
        <h1>Paleta de comandos</h1>
        <p class="lede">Abre la paleta, baja con las flechas y pulsa Enter. Cada paso tiene su tic.</p>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false">Silenciar</button>
    </header>
    <p class="now" aria-live="polite">Toca para activar el audio</p>
    
    <button type="button" class="primary" data-open>Abrir paleta</button>
    <section class="panel palette" data-palette hidden></section>
    <p class="result" data-result></p>

  </main>
  <script src="script.js"></script>
</body>
</html>
