<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stacking Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Stack on scroll</h1>
      <p>Each card shrinks as the next one arrives.</p>
    </header>

    <div class="stack">
      <article class="card" data-card>
        <h2>Capture</h2>
        <p>Collect signals from every channel in one pipeline.</p>
      </article>
      <article class="card" data-card>
        <h2>Shape</h2>
        <p>Normalize events into a schema your team trusts.</p>
      </article>
      <article class="card" data-card>
        <h2>Ship</h2>
        <p>Push insights to dashboards without another ETL job.</p>
      </article>
      <article class="card" data-card>
        <h2>Repeat</h2>
        <p>Automate the loop and keep latency low.</p>
      </article>
    </div>

    <footer class="bottom">Done</footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
