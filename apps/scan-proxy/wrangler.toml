name = "stealthis-scan-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Rate limit por IP, nativo de Cloudflare: no necesita KV ni Durable Objects.
# El periodo solo admite 10 o 60 segundos.
[[unsafe.bindings]]
name = "CAPTURE_LIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }
