name = "stealthis-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Snippet bodies are served as Static Assets (public/s/<slug>.json) so they are
# NOT bundled into the Worker script — keeps the script under the 3 MiB limit.
# get_snippet fetches them at runtime via the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"

[[rules]]
type = "Data"
globs = ["**/*.json"]
fallthrough = true
